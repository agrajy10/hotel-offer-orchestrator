services:
  redis:
    image: redis:7-alpine
    container_name: hotel-offer-orchestrator-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  temporal:
    image: temporalio/admin-tools:latest
    container_name: hotel-offer-orchestrator-temporal
    command:
      - temporal
      - server
      - start-dev
      - --ip
      - "0.0.0.0"
      - --port
      - "7233"
      - --ui-ip
      - "0.0.0.0"
      - --ui-port
      - "8080"
      - --db-filename
      - /tmp/temporal.db
    ports:
      - "7233:7233"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 2>/dev/null | grep -q SERVING || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: dev
    image: hotel-offer-orchestrator:dev
    container_name: hotel-offer-orchestrator-worker
    command: ["npx", "tsx", "watch", "src/worker.ts"]
    environment:
      - NODE_ENV=development
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - REDIS_URL=redis://redis:6379
      - SUPPLIER_BASE_URL=http://api:3000
      - TASK_QUEUE=hotel-offers
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: dev
    image: hotel-offer-orchestrator:dev
    container_name: hotel-offer-orchestrator-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - REDIS_URL=redis://redis:6379
      - SUPPLIER_BASE_URL=http://127.0.0.1:3000
      - TASK_QUEUE=hotel-offers
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped
