services:
  postgresql:
    image: postgres:15-alpine
    container_name: hotel-offer-orchestrator-postgres
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hotel-offer-orchestrator-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    container_name: hotel-offer-orchestrator-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12_pgx
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    ports:
      - "7233:7233"
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    container_name: hotel-offer-orchestrator-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDR=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: .
      target: dev
    image: hotel-offer-orchestrator:dev
    container_name: hotel-offer-orchestrator-worker
    command: ["npx", "tsx", "watch", "src/worker.ts"]
    environment:
      - NODE_ENV=development
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - REDIS_URL=redis://redis:6379
      - SUPPLIER_BASE_URL=http://api:3000
      - TASK_QUEUE=hotel-offers
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      temporal:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      target: dev
    image: hotel-offer-orchestrator:dev
    container_name: hotel-offer-orchestrator-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - REDIS_URL=redis://redis:6379
      - SUPPLIER_BASE_URL=http://127.0.0.1:3000
      - TASK_QUEUE=hotel-offers
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      temporal-ui:
        condition: service_started
      worker:
        condition: service_started
    restart: unless-stopped
