services:
  api:
    build:
      context: .
      target: dev
    image: hotel-offer-orchestrator:dev
    container_name: hotel-offer-orchestrator-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - TEMPORAL_ADDRESS=host.docker.internal:7233
      - TEMPORAL_NAMESPACE=default
      - REDIS_URL=redis://host.docker.internal:6380
      - SUPPLIER_BASE_URL=http://127.0.0.1:3000
      - TASK_QUEUE=hotel-offers
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
    restart: unless-stopped
