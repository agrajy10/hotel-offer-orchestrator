services:
  api:
    build:
      context: .
      target: dev
    image: hotel-offer-orchestrator:dev
    container_name: hotel-offer-orchestrator-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
    restart: unless-stopped
